<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Satisfy&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Allura&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <title>Document</title>
</head>


<body>
    <div class="container">
        <section>
            <div class="intro">
                <div class="titulo">
                    <!-- <h1>Luciana</h1> -->
                    <p>Te invito a mis XV años</p>
                </div>
                <div class="descripcion">
                    <!-- <p class="comp">En compañía de mis seres queridos </p> -->
                    <div class="img-heart">
                        <img src="/img/icons8-me-gusta-50.png" alt="">
                    </div>

                </div>

                <div class="info-fecha">
                    <div class="infoFecha">

                        <h2 class="nombre">Luciana</h2>


                        <div class="fecha">
                            <p>SÁBADO</p>
                            <h1>05</h1>
                            <p>AGOSTO</p>
                        </div>


                    </div>

                    <div class="acciones">
                        <!-- Confirmación -->
                        <a href="https://wa.me/5493886715770?text=Hola!%20Confirmo%20mi%20asistencia%20a%20los%20XV"
                            target="_blank" class="accion">
                            <img src="img/btn_ubicacion-removebg-preview.png" alt="Botón" />
                            <span>Confirmar<br>Presencia</span>
                        </a>

                        <!-- Ubicación -->
                        <a href="https://maps.google.com/?q=-26.816,-65.216" target="_blank" class="accion">
                            <img src="img/btn_invitacion-removebg-preview.png" alt="Botón" />
                            <span>Ubicación</span>
                        </a>

                        <!-- Regalo -->
                        <button type="button" class="accion" id="botonRegalo">
                            <img src="img/btn_regalo-removebg-preview.png" alt="Botón" />
                            <span>Regalo</span>
                        </button>

                    </div>

                    <div class="frase">
                        <p>LOS ESPERAMOS PARA CELEBRAR JUNTOS</p>
                    </div>
                </div>







            </div>
        </section>



    </div>

    <div id="panelPago" class="panel">
        <h3>Datos de pago</h3>
        <p><strong>Alias:</strong> mi.alias.ejemplo</p>
        <p><strong>CVU:</strong> 000000</p>
        <button id="cerrar">Cerrar</button>
      </div>
  
      <script>
        const btn = document.getElementById("botonRegalo");
        const panel = document.getElementById("panelPago");
        const cerrar = document.getElementById("cerrar");
  
        btn.addEventListener("click", () => {
          panel.style.display = "block";
        });
  
        cerrar.addEventListener("click", () => {
          panel.style.display = "none";
        });
      </script>
</body>

</html>
